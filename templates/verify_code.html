<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificar código</title>

<style>
body{
    font-family:Arial;
    background:#020617;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:420px;
    background:#111827;
    padding:40px;
    border-radius:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:20px;
    text-align:center;
    letter-spacing:5px;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    background:#22c55e;
    color:white;
    font-weight:bold;
    border-radius:10px;
}

a{
    color:#22c55e;
}

.msg{
    color:#f87171;
}
</style>
</head>

<body>

<div class="card">

<h1>Verificar código</h1>

<p>Escribe el código de 6 dígitos que llegó a tu correo.</p>

{% if message %}
<p class="msg">{{ message }}</p>
{% endif %}

<form method="POST">
    <input type="text" name="code" placeholder="000000" maxlength="6" required>
    <button type="submit">VERIFICAR</button>
</form>

<p>
  <a href="/forgot-password">Enviar otro código</a>
</p>

<p>
  <a href="/login">Volver al login</a>
</p>

</div>

</body>
</html>
