<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nueva contraseña</title>

<style>
body{
    font-family:Arial;
    background:#020617;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:420px;
    background:#111827;
    padding:40px;
    border-radius:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    background:#22c55e;
    color:white;
    font-weight:bold;
    border-radius:10px;
}

a{
    color:#22c55e;
}

.msg{
    color:#f87171;
}
</style>
</head>

<body>

<div class="card">

<h1>Nueva contraseña</h1>

<p>Ingresa y confirma tu nueva contraseña.</p>

{% if message %}
<p class="msg">{{ message }}</p>
{% endif %}

<form method="POST">
    <input type="password" name="password" placeholder="Nueva contraseña" required>
    <input type="password" name="confirm_password" placeholder="Confirmar contraseña" required>

    <button type="submit">CAMBIAR CONTRASEÑA</button>
</form>

<p>
  <a href="/login">Volver al login</a>
</p>

</div>

</body>
</html>
