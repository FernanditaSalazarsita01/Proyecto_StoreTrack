<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:420px;
    background:#111827;
    padding:40px;
    border-radius:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    background:#3b82f6;
    color:white;
    font-weight:bold;
    border-radius:10px;
}

a{
    color:#22c55e;
}

.msg{
    color:#facc15;
}
</style>
</head>

<body>

<div class="card">

<h1>Recuperar contraseña</h1>

<p>Ingresa tu empresa y correo registrado.</p>

{% if message %}
<p class="msg">{{ message }}</p>
{% endif %}

<form method="POST">
    <input type="text" name="company" placeholder="Empresa" required>
    <input type="email" name="email" placeholder="Correo registrado" required>

    <button type="submit">ENVIAR CÓDIGO</button>
</form>

<p>
  <a href="/login">Volver al login</a>
</p>

</div>

</body>
</html>
